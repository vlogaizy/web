/* =====================
LOGIN
===================== */

function unlock(){

let p=password.value;

if(p==="1111"){

localStorage.setItem(
"lazyAIUnlocked",
"yes"
);

login.style.display="none";

}

else{

error.style.display="block";

}

}


window.onload=()=>{

if(
localStorage.getItem("lazyAIUnlocked")
==="yes"
){

login.style.display="none";

}

};



password.onkeypress=e=>{

if(e.key==="Enter")
unlock();

};





/* =====================
NETWORK
===================== */


const canvas=document.getElementById("network");

const ctx=canvas.getContext("2d");


canvas.width=innerWidth;

canvas.height=innerHeight;


let mouse={x:null,y:null};


onmousemove=e=>{

mouse.x=e.clientX;

mouse.y=e.clientY;

};



class Node{


constructor(){

this.x=Math.random()*canvas.width;

this.y=Math.random()*canvas.height;


this.vx=(Math.random()-.5)*.5;

this.vy=(Math.random()-.5)*.5;

}



update(){

this.x+=this.vx;

this.y+=this.vy;

}



draw(){

ctx.beginPath();

ctx.arc(
this.x,
this.y,
2,
0,
Math.PI*2
);


ctx.fillStyle="#8be9fd";


ctx.fill();

}


}




let nodes=[];


for(let i=0;i<100;i++){

nodes.push(new Node());

}




function animate(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



nodes.forEach(n=>{

n.update();

n.draw();

});




for(let a=0;a<nodes.length;a++){


for(let b=a;b<nodes.length;b++){


let dx=nodes[a].x-nodes[b].x;

let dy=nodes[a].y-nodes[b].y;


let d=Math.sqrt(dx*dx+dy*dy);



if(d<120){


ctx.beginPath();

ctx.moveTo(
nodes[a].x,
nodes[a].y
);


ctx.lineTo(
nodes[b].x,
nodes[b].y
);



ctx.strokeStyle=
"rgba(150,220,255,.2)";


ctx.stroke();


}


}

}


requestAnimationFrame(animate);


}


animate();

function pick(a){

return a[Math.floor(Math.random()*a.length)];

}

/* =====================

===================== */


function generatePrompt(){


let history=JSON.parse(

localStorage.getItem("eggHistory")||"[]"

);



let result;

let key;



do{


result={

m:pick(data.material),

r:pick(data.rune),

c:pick(data.creature),

s:pick(data.skin),

e:pick(data.eyes),

x:pick(data.element),

l:pick(data.light),

f:pick(data.floor)

};



key=JSON.stringify(result);



}

while(history.includes(key));



history.push(key);



localStorage.setItem(

"eggHistory",

JSON.stringify(history)

);





output.value=`Ultra-realistic, hyper-detailed macro photography on a ${result.f}. A single ${result.m} magical egg is nestled on the ground. The egg surface is etched with glowing ${result.r} runic patterns. A wide crack has formed across the shell. A baby ${result.c} emerges from the egg. Its body has a ${result.s} bioluminescent glow. The creature's eyes are ${result.e}. Tiny tendrils of ${result.x} escape from the egg. Soft ${result.l} filters through the forest canopy. Cinematic dramatic lighting. Extreme macro lens. The creature is moving naturally according to its species, flying creatures are flying, running creatures are running, swimming creatures are swimming, with realistic movement and behavior. High-resolution photorealistic fantasy creature photography. 8K detail, realistic textures, magical atmosphere.`;

}
